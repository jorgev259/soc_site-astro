name: Build site docker image
on:
  push:
    branches: [development, production]
  workflow_dispatch:

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: soc
          MARIADB_USER: soc
          MARIADB_PASSWORD: soc
        ports:
          - 3306:3306
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8
      - name: Set image tag
        run: echo "TAG=${{ steps.branch-names.outputs.current_branch }}" >> $GITHUB_ENV

      - name: Build Docker Images
        run: docker build --build-arg MODE=${TAG} --network host -t soc-site:${TAG} .
      - name: Push image
        run: |
          docker login -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_KEY }} ${{ secrets.REGISTRY_HOST }}
          docker tag soc-site:${TAG} ${{ secrets.REGISTRY_HOST }}/soc/soc-site:${TAG}
          docker push ${{ secrets.REGISTRY_HOST }}/soc/soc-site:${TAG}
