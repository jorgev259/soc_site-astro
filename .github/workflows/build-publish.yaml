name: Build and publish image
on:
  push:
    branches:
      - development
      - production
  workflow_dispatch:

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch names.
        id: branch-names
        uses: tj-actions/branch-names@v8
      - name: Set image tag
        run: echo "TAG=${{ steps.branch-names.outputs.current_branch }}" >> $GITHUB_ENV

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            MODE=${{ env.TAG }}
          tags: |
            ghcr.io/jorgev259/soc-site:${{ env.TAG }}
